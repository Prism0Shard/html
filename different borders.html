<!DOCTYPE>
<html>
    <head>
        <title>Different borders</title>
    </head>
        <style>
            .box1{border:2px solid red;margin:10px;padding:10px;}
            .box2{border:4px dashed blue;margin:15px;padding:15px;}
            .box3{border:6px dotted green;margin:20px;padding:20px;}
            </style>
            <body>
                <div class="box1">Box1</div>
                <div class="box2">Box2</div>
                <div class="box3">Box3</div>
            </body>
            </html>
