<!DOCTYPE>
<html>
<head>
<title>Rowspan ans Colspan Example</title>
</head>
<body>
<h1>Rowspan and Colspan</h1>
<table border="1">
<tr><th rowspan="2">Name</th><th colspan="2">Marks</th></tr>
<tr><th>Maths</th><th>Science</th></tr>
<tr><td>John</td><td>85</td><td>90</td></tr>
<tr><td>Jane</td><td>92</td><td>88</td></tr>
</table>
</body>
</html>
