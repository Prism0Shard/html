<!DOCTYPE>
<html>
    <head>
        <title>style list</title>
    </head>
    <style>
        .box{background-color:lightpink;margin:30px;padding:20px;border:2px solid black;}
        ul{list-style-type:square;}
        ol{list-style-type:upper-roman;}

        </style>
        <body>
         <div class="box">style list</div>
            <ul><li>Apple</li><li>Banana</li></ul>
            <ol><li>Mango</li><li>Orange</li></ol>
        </body>
</html>
